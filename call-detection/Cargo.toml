[package]
name = "call-detection"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native, evidence-based desktop call observation and recording-independent session policy"

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }
